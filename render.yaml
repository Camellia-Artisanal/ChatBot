services:
  - type: web
    name: camellia-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENABLE_WEB_TESTER
        value: "true"
      - key: BYPASS_AD_GATE
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.7
